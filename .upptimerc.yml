# Monitor externo de TIL Foundry (spec SpecsDD: producto/core-v0/monitor-externo.md, ME-1 a ME-6).
# Mira a TIL Foundry desde afuera, cada 5 minutos, sin credenciales de Core ni de clientes.
owner: TIL-Costa-Rica
repo: tilFoundry-estado
user-agent: tilfoundry-estado

sites:
  # ME-2: /salud tiene que responder 200 con "estado":"lista". En vaciando o detenido sigue diciendo
  # "lista" y el monitor lo ve arriba (ME-5); aislado, lo ve caído.
  - name: Servicio de TIL Foundry (desarrollo)
    slug: servicio-desarrollo
    url: https://dev-foundry.tilcr.cloud/salud
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"estado":"lista"'
    maxResponseTime: 10000
  - name: Página de estado (desarrollo)
    slug: pagina-de-estado-desarrollo
    url: https://dev-foundry.tilcr.cloud/estado
    expectedStatusCodes: [200]
    maxResponseTime: 10000
  - name: Sitio
    slug: sitio
    url: https://foundry.tilcr.cloud
    expectedStatusCodes: [200]
    maxResponseTime: 10000

status-website:
  cname: estado.tilcr.cloud
  name: Estado de TIL Foundry
  introTitle: "**Estado de TIL Foundry**, visto desde afuera."
  introMessage: >-
    Esta página revisa cada 5 minutos que TIL Foundry responda, de forma independiente del servicio.
    Los servicios marcados «desarrollo» son un ambiente de prueba.
  navbar:
    - title: Estado
      href: /
    - title: Sitio
      href: https://foundry.tilcr.cloud

skipDescriptionUpdate: true
skipTopicsUpdate: true

commitMessages:
  readmeContent: ":pencil: Actualiza el resumen del README [skip ci] [upptime]"
  summaryJson: ":card_file_box: Actualiza el resumen de estado [skip ci] [upptime]"
  statusChange: "$EMOJI $SITE_NAME está $STATUS ($RESPONSE_CODE en $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: ":bento: Actualiza los gráficos [skip ci] [upptime]"

